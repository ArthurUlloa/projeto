<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Quicklist</title>
</head>
<body>
    <header>
        <img src="./imagem/logo.png" alt="logo do quicklist">
    </header>
    <main>
        <section class="first">
            <h1>Compras da semana</h1>
            <div>
                <input type="text" id="novo-item" placeholder="Adicionar novo item">
            </div>
        </section>
        <section class="itens">
            <div class="item">
                <div>
                    <input type="checkbox" id="item-1">
                    <label for="item-1">Pão de Forma</label>
                </div>
            
                <button>
                    <img src="./imagem/trash-icon.svg" alt="icone de lixo">
                </button>
            </div>
            <div class="item">
                <div>
                    <input type="checkbox" id="item-2">
                    <label for="item-2">Café Preto</label>
                </div>
            
                <button>
                    <img src="./imagem/trash-icon.svg" alt="icone de lixo">
                </button>
            </div>
            <div class="item">
                <div>
                    <input type="checkbox" id="item-3">
                    <label for="item-3">Suco de laranja</label>
                </div>
            
                <button>
                    <img src="./imagem/trash-icon.svg" alt="icone de lixo">
                </button>
            </div>
        </section>
    </main>
</body>
</html>
